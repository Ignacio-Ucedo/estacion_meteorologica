# ChirpStack v4 — configuración para prototipo con band plan AU915 sub-band 2
# Referencia: https://www.chirpstack.io/docs/chirpstack/configuration.html

[logging]
level = "info"

[postgresql]
dsn = "postgres://chirpstack:chirpstack@postgres/chirpstack?sslmode=disable"

[redis]
servers = ["redis://redis/"]

[network]
net_id = "000000"
# AU915: 915–928 MHz (banda LoRaWAN regulatoria de Argentina, ENACOM).
# PoC usa sub-band 2 (canales 8–15, canal fijo 916.8 MHz SF7BW125).
enabled_regions = ["au915_2"]

[api]
bind = "0.0.0.0:8080"
secret = "change-this-secret-in-production"

[integration]
enabled = ["mqtt"]

[integration.mqtt]
server = "tcp://mosquitto:1883/"
