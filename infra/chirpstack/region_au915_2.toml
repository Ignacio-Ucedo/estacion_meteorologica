# ChirpStack v4 — región AU915 sub-band 2
# PoC gateway single-channel: 903.9 MHz SF7BW125 (canal 8, sub-band 2).
# Banda regulatoria Argentina: AU915 (902–928 MHz).

[[regions]]

  id="au915_2"
  description="AU915 sub-band 2 (canales 8–15, PoC single-channel 903.9 MHz)"
  common_name="AU915"

  [regions.gateway]
    force_gws_private=false

    [regions.gateway.backend]
      enabled="mqtt"

      [regions.gateway.backend.mqtt]
        topic_prefix="au915_2"
        server="tcp://$MQTT_BROKER_HOST:1883"
        username=""
        password=""
        qos=0
        clean_session=false
        client_id=""
        keep_alive_interval="30s"
        ca_cert=""
        tls_cert=""
        tls_key=""

  # Canales upstream 125 kHz — sub-band 2 (canales 8–15)
  # Frecuencias: 902.3 + n*0.2 MHz para n=8..15
  [[regions.gateway.channels]]
    frequency=903900000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10]

  [[regions.gateway.channels]]
    frequency=904100000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10]

  [[regions.gateway.channels]]
    frequency=904300000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10]

  [[regions.gateway.channels]]
    frequency=904500000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10]

  [[regions.gateway.channels]]
    frequency=904700000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10]

  [[regions.gateway.channels]]
    frequency=904900000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10]

  [[regions.gateway.channels]]
    frequency=905100000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10]

  [[regions.gateway.channels]]
    frequency=905300000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10]

  # Canal upstream 500 kHz — sub-band 2
  [[regions.gateway.channels]]
    frequency=904600000
    bandwidth=500000
    modulation="LORA"
    spreading_factors=[8]

  [regions.network]
    installation_margin=10
    rx_window=0
    rx1_delay=1
    rx1_dr_offset=0
    # RX2 AU915: 923.3 MHz DR8 (SF12BW500)
    rx2_dr=8
    rx2_frequency=923300000
    rx2_prefer_on_rx1_dr_lt=0
    rx2_prefer_on_link_budget=false
    downlink_tx_power=-1
    adr_disabled=false
    min_dr=0
    max_dr=6

    [regions.network.rejoin_request]
      enabled=false
      max_count_n=0
      max_time_n=0

    [regions.network.class_b]
      ping_slot_dr=8
      ping_slot_frequency=923300000
