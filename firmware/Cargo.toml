[package]
name = "weather-firmware"
version = "0.1.0"
edition = "2021"
resolver = "2"

[lib]
name = "weather_firmware"
path = "src/lib.rs"

# Nodo sensor LoRaWAN con sensores físicos (DHT22, pluviómetro, anemómetro)
[[bin]]
name = "sensor-node"
path = "src/bin/sensor-node.rs"

# Nodo sensor mock: datos simulados, sin GPIO de sensores, para pruebas de banco
[[bin]]
name = "sensor-node-mock"
path = "src/bin/sensor-node-mock.rs"

# Gateway single-channel UDP packet forwarder hacia ChirpStack
[[bin]]
name = "gateway-node"
path = "src/bin/gateway-node.rs"

# Gateway sintético: WiFi + LoRaWAN via UDP, sin SX1278, para validar la cadena completa
[[bin]]
name = "gateway-node-mock"
path = "src/bin/gateway-node-mock.rs"

[dependencies]
anyhow = "1"
log = "0.4"
heapless = "0.8"
esp-idf-hal = "0.46"
esp-idf-svc = "0.52"
embedded-svc = "0.29"
weather-core = { path = "../weather-core" }

# LR1121 — nodo sensor (Modem-E) y gateway (transceiver)
lr1121-modem-e   = { path = "lr1121-modem-e" }
lr1121-transceiver = { path = "lr1121-transceiver" }

# Serialización JSON para el protocolo Semtech UDP del gateway
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"

[build-dependencies]
embuild = "0.33"
