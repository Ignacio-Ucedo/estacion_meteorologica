name: Operator App Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: appimage,deb
          - platform: windows-latest
            bundles: msi
          - platform: macos-latest
            bundles: dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Linux: webkit2gtk-4.1 requerido por Tauri v2
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: operator-app/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workdir: operator-app/src-tauri

      - name: Install frontend dependencies
        working-directory: operator-app
        run: npm ci

      # ── esptool sidecar ──────────────────────────────────────────────────────
      # Descarga el binario standalone oficial de esptool y lo ubica como sidecar
      # Tauri con el triple de arquitectura correcto.
      # En desarrollo se usa el script placeholder (requiere Python + esptool instalado).

      - name: Download esptool sidecar (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        working-directory: operator-app/src-tauri/binaries
        run: |
          curl -fsSL "https://github.com/espressif/esptool/releases/download/v4.8.1/esptool-v4.8.1-linux-amd64.zip" -o esptool.zip
          unzip -q esptool.zip
          cp esptool/esptool esptool-x86_64-unknown-linux-gnu
          chmod +x esptool-x86_64-unknown-linux-gnu
          rm -rf esptool.zip esptool/

      - name: Download esptool sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        working-directory: operator-app/src-tauri/binaries
        run: |
          curl -fsSL "https://github.com/espressif/esptool/releases/download/v4.8.1/esptool-v4.8.1-win64.zip" -o esptool.zip
          unzip -q esptool.zip
          cp esptool/esptool.exe esptool-x86_64-pc-windows-msvc.exe
          rm -rf esptool.zip esptool/

      - name: Download esptool sidecar (macOS)
        if: startsWith(matrix.platform, 'macos-')
        working-directory: operator-app/src-tauri/binaries
        run: |
          curl -fsSL "https://github.com/espressif/esptool/releases/download/v4.8.1/esptool-v4.8.1-macos.zip" -o esptool.zip
          unzip -q esptool.zip
          TARGET=$(rustc -vV | sed -n 's/^host: //p')
          cp esptool/esptool "esptool-${TARGET}"
          chmod +x "esptool-${TARGET}"
          rm -rf esptool.zip esptool/

      # ── Build y publicación ───────────────────────────────────────────────────
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: operator-app
          tagName: ${{ github.ref_name }}
          releaseName: "Operator App ${{ github.ref_name }}"
          releaseBody: |
            Aprovisionamiento de nodos meteorológicos — versión ${{ github.ref_name }}.

            | Plataforma | Archivo |
            |------------|---------|
            | Linux | `.AppImage` (portable) · `.deb` (Debian/Ubuntu) |
            | Windows | `.msi` |
            | macOS | `.dmg` |

            > **Linux — permisos USB**: antes de usar la app, configurá el acceso a los puertos serie. Ver [README → Linux permisos USB](https://github.com/Ignacio-Ucedo/estacion_meteorologica/blob/main/operator-app/README.md#linux-permisos-usb).
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: --bundles ${{ matrix.bundles }}
