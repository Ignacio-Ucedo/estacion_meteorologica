name: Operator App Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: appimage,deb
          - platform: windows-latest
            bundles: msi
          - platform: macos-latest
            bundles: dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Linux: webkit2gtk-4.1 requerido por Tauri v2; acl requerido para setfacl
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            acl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: operator-app/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workdir: operator-app/src-tauri

      - name: Install frontend dependencies
        working-directory: operator-app
        run: npm ci

      # ── esptool sidecar ──────────────────────────────────────────────────────
      - name: Download esptool sidecar (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        working-directory: operator-app/src-tauri/binaries
        run: |
          curl -fsSL "https://github.com/espressif/esptool/releases/download/v4.8.1/esptool-v4.8.1-linux-amd64.zip" -o esptool.zip
          unzip -q esptool.zip
          find . -name 'esptool' -type f | head -1 | xargs -I{} cp {} esptool-x86_64-unknown-linux-gnu
          chmod +x esptool-x86_64-unknown-linux-gnu
          rm -rf esptool.zip esptool-v4.8.1-linux-amd64/

      - name: Download esptool sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        working-directory: operator-app/src-tauri/binaries
        run: |
          curl -fsSL "https://github.com/espressif/esptool/releases/download/v4.8.1/esptool-v4.8.1-win64.zip" -o esptool.zip
          unzip -q esptool.zip
          find . -name 'esptool.exe' | head -1 | xargs -I{} cp {} esptool-x86_64-pc-windows-msvc.exe
          rm -rf esptool.zip esptool-v4.8.1-win64/

      - name: Download esptool sidecar (macOS)
        if: startsWith(matrix.platform, 'macos-')
        working-directory: operator-app/src-tauri/binaries
        run: |
          curl -fsSL "https://github.com/espressif/esptool/releases/download/v4.8.1/esptool-v4.8.1-macos.zip" -o esptool.zip
          unzip -q esptool.zip
          TARGET=$(rustc -vV | sed -n 's/^host: //p')
          find . -name 'esptool' -type f | head -1 | xargs -I{} cp {} "esptool-${TARGET}"
          chmod +x "esptool-${TARGET}"
          rm -rf esptool.zip esptool-v4.8.1-macos/

      # ── Build ─────────────────────────────────────────────────────────────────
      # tauri-action sin tagName solo buildea, no crea release.
      # softprops/action-gh-release (job siguiente) maneja la publicación.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5
        with:
          projectPath: operator-app
          args: --bundles ${{ matrix.bundles }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operator-app-${{ matrix.platform }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      # El runner binary corre como root dentro del container Docker de ubuntu-24.04
      # y crea save_state_<uuid> como root:root durante el post-cleanup (DESPUÉS de
      # que cualquier chown del paso de usuario haya corrido). setfacl -d aplica una
      # ACL por defecto al directorio para que los archivos creados por root hereden
      # permisos de escritura para "otros" (= usuario runner de Node.js).
      - name: Fix runner file-commands permissions (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          sudo mkdir -p "$RUNNER_TEMP/_runner_file_commands"
          sudo chmod 777  "$RUNNER_TEMP/_runner_file_commands"
          setfacl -d -m o::rw "$RUNNER_TEMP/_runner_file_commands"

  release:
    name: Create GitHub Release
    needs: build-tauri
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Operator App ${{ github.ref_name }}"
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: false
          body: |
            Aprovisionamiento de nodos meteorológicos — versión ${{ github.ref_name }}.

            | Plataforma | Archivo |
            |------------|---------|
            | Linux | `.AppImage` (portable) · `.deb` (Debian/Ubuntu) |
            | Windows | `.msi` |
            | macOS | `.dmg` |

            > **Linux — permisos USB**: antes de usar la app, configurá el acceso a los puertos serie. Ver [README → Linux permisos USB](https://github.com/Ignacio-Ucedo/estacion_meteorologica/blob/main/operator-app/README.md#linux-permisos-usb).
          files: artifacts/**/*
