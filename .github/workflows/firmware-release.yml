name: Firmware Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build gateway-node-mock
    runs-on: ubuntu-latest
    container:
      image: espressif/idf-rust:all_latest
      options: --user root

    env:
      WIFI_SSID: ${{ secrets.WIFI_SSID || 'ci-placeholder' }}
      WIFI_PASS: ${{ secrets.WIFI_PASS || 'ci-placeholder' }}
      CHIRPSTACK_HOST: ${{ secrets.CHIRPSTACK_HOST || '0.0.0.0' }}
      CARGO_HOME: /usr/local/cargo
      # El runner setea HOME=/github/home (read-only); apuntamos git config
      # a /root/.gitconfig que sí es writable cuando corremos como root.
      GIT_CONFIG_GLOBAL: /root/.gitconfig

    steps:
      # actions/checkout@v4 es una JS action: su post-step corre en el HOST
      # como uid 1001 e intenta escribir save_state en /__w/_temp/ que quedó
      # owned by root (container corre como root). Reemplazamos con git nativo
      # dentro del container: sin JS action → sin post-step → sin EACCES.
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD
          git submodule update --init --recursive

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            firmware/target
          key: ${{ runner.os }}-cargo-esp32-${{ hashFiles('firmware/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-esp32-

      - name: Configure ESP Rust toolchain
        run: |
          # espressif/idf-rust instala el toolchain para su usuario default.
          # Buscamos el toolchain 'esp' y apuntamos RUSTUP_HOME al directorio correcto.
          for candidate in /usr/local/rustup /root/.rustup /home/user/.rustup /home/esp/.rustup; do
            if [ -d "$candidate/toolchains/esp" ]; then
              export RUSTUP_HOME="$candidate"
              echo "RUSTUP_HOME=$candidate" >> "$GITHUB_ENV"
              echo "Found esp toolchain at: $candidate"
              break
            fi
          done
          rustup default esp

      - name: Install espflash
        run: cargo install espflash --locked

      - name: Set up ESP environment for root
        run: |
          # espressif/idf-rust usa espup, que genera ~/export-esp.sh
          # (no el export.sh del esp-idf clásico).
          USER_HOME=$(dirname "$RUSTUP_HOME")
          EXPORT_SH="$USER_HOME/export-esp.sh"
          if [ ! -f "$EXPORT_SH" ]; then
            echo "ERROR: $EXPORT_SH no encontrado. Contenido de $USER_HOME:"
            ls -la "$USER_HOME/" || true
            exit 1
          fi
          echo "Sourcing: $EXPORT_SH"
          . "$EXPORT_SH"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Build gateway-node-mock (release)
        working-directory: firmware
        run: cargo build --release --bin gateway-node-mock

      - name: Generate .bin image
        working-directory: firmware
        run: |
          espflash save-image \
            --chip esp32 \
            --merge \
            target/xtensa-esp32-espidf/release/gateway-node-mock \
            gateway-node-mock.bin

      - name: Copy partition table
        working-directory: firmware
        run: cp partitions.csv gateway-node-mock-partitions.csv

      - name: Generate SHA256 checksums
        working-directory: firmware
        run: |
          sha256sum gateway-node-mock.bin          > gateway-node-mock.bin.sha256
          sha256sum gateway-node-mock-partitions.csv > gateway-node-mock-partitions.csv.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}
          path: |
            firmware/gateway-node-mock.bin
            firmware/gateway-node-mock.bin.sha256
            firmware/gateway-node-mock-partitions.csv
            firmware/gateway-node-mock-partitions.csv.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            firmware/gateway-node-mock.bin
            firmware/gateway-node-mock.bin.sha256
            firmware/gateway-node-mock-partitions.csv
            firmware/gateway-node-mock-partitions.csv.sha256

